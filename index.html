<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagina regalo</title>
<meta name="description" content="Pagine regalo per compleanni, liste nozze e feste: regala un viaggio con Sogni ed Emozioni e Top Crociere.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#001c54">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#001c54; --navy-2:#0a2a6b; --ink:#14213d; --muted:#5b6478; --line:#e3e6ee;
  --paper:#fbf8f3; --card:#ffffff; --accent:#e8a33d; --accent-ink:#5a3a00; --ok:#1f7a4d; --bad:#b3261e;
  --r:18px;
}
body.se{ --accent:#f0806a; --accent-ink:#5c1d10; }
body.tc{ --accent:#4fb3e8; --accent-ink:#06324a; }
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.15;margin:0}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{background:var(--navy);color:#fff}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px;gap:12px}
.brand{font-weight:700;letter-spacing:.02em;font-size:15px}
.brand small{display:block;font-weight:500;opacity:.75;font-size:12px;letter-spacing:.04em}
.pill{display:inline-block;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.hero{background:var(--navy);color:#fff;padding:8px 0 56px;position:relative;overflow:hidden}
.hero .foto{width:100%;aspect-ratio:16/10;border-radius:var(--r);background:var(--navy-2) center/cover no-repeat;margin:8px 0 22px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.hero .occ{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:12px}
.hero h1{font-size:clamp(30px,7vw,46px);margin:6px 0 8px}
.hero .chi{opacity:.85;font-size:15px}
.hero .msg{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:19px;margin:18px 0 0;opacity:.95;white-space:pre-wrap}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 10% 70%,#fff 50%,transparent 51%)}
main{margin-top:-34px;position:relative;padding-bottom:40px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 6px 24px rgba(20,33,61,.08);padding:22px;margin-bottom:16px;border:1px solid var(--line)}
.card h2{font-size:23px;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.viaggio{display:flex;gap:12px;align-items:center}
.viaggio .ico{font-size:28px}
.bar{height:10px;background:#eef0f5;border-radius:999px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .8s}
.esp{display:grid;gap:10px;margin:6px 0 14px}
.esp label{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.esp label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff)}
.esp input{margin-top:4px;accent-color:var(--navy)}
.esp b{display:block}
.esp .imp{margin-left:auto;font-weight:700;white-space:nowrap}
.esp small{color:var(--muted)}
.importi{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.importi button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.importi button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.f{display:grid;gap:12px}
.f label.l{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
.f input[type=text],.f input[type=tel],.f input[type=email],.f input[type=number],.f textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--navy)}
.f textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;accent-color:var(--navy);width:18px;height:18px;flex:none}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 24px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;background:var(--navy);color:#fff}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}
.full{width:100%}
.err{background:#fdecea;color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;display:none}
.note{font-size:13px;color:var(--muted)}
.dati{border:1.5px dashed var(--line);border-radius:14px;padding:4px 14px;margin:12px 0}
.riga{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.riga:last-child{border-bottom:0}
.riga span{font-size:12px;color:var(--muted);display:block}
.riga b{font-size:15px;word-break:break-all}
.ok-ico{font-size:44px}
.dedica{border-left:3px solid var(--accent);padding:6px 0 6px 14px;margin:14px 0}
.dedica p{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:17px;margin:0 0 4px;white-space:pre-wrap}
.dedica small{color:var(--muted)}
.tot{display:flex;gap:14px;flex-wrap:wrap}
.tot div{flex:1;min-width:140px;background:#f4f6fb;border-radius:14px;padding:14px}
.tot b{font-family:Fraunces,Georgia,serif;font-size:28px;display:block}
.tot span{font-size:13px;color:var(--muted)}
#qr{background:#fff;display:inline-block;padding:10px;border-radius:12px;border:1px solid var(--line)}
#qr img,#qr canvas{display:block;width:200px;height:200px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 16px 40px}
footer b{color:var(--ink)}
details summary{cursor:pointer;font-weight:600}
.load{text-align:center;padding:80px 16px;color:var(--muted)}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.strip{display:flex;gap:8px;overflow-x:auto;margin:-10px 0 18px;padding-bottom:4px;scrollbar-width:thin}
.strip button,.destgal button{flex:0 0 auto;border:0;padding:0;cursor:zoom-in;border-radius:12px;background:var(--navy-2) center/cover no-repeat}
.strip button{width:92px;height:64px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.destgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:14px}
.destgal button{width:100%;aspect-ratio:4/3}
.lb{position:fixed;inset:0;background:rgba(8,12,24,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.lb img{max-width:100%;max-height:86vh;border-radius:10px}
.lb .x,.lb .nav{position:absolute;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;width:44px;height:44px;border-radius:50%;cursor:pointer}
.lb .x{top:14px;right:14px}.lb .p{left:10px;top:50%}.lb .n{right:10px;top:50%}
.gm{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}
.gm .g{position:relative;width:104px;height:78px;border-radius:12px;background:#eef0f5 center/cover no-repeat;border:2.5px solid transparent}
.gm .g.prima{border-color:var(--accent)}
.gm .g button{position:absolute;border:0;border-radius:8px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;line-height:22px;padding:0 7px;cursor:pointer}
.gm .g .gx{top:4px;right:4px}.gm .g .gp{bottom:4px;left:4px}
.gm .g .tag{position:absolute;bottom:4px;left:4px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.codice{font-family:Fraunces,Georgia,serif;font-size:34px;letter-spacing:2px;background:#f4f6fb;border:2px dashed var(--accent);border-radius:14px;padding:10px 18px;display:inline-block;margin:6px 0 12px}
.pren{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.pren:last-child{border-bottom:0}
.pren small{display:block;color:var(--muted);font-size:12px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;align-self:center}
.st.ok{background:#e3f6ea;color:#1c7a3e}.st.at{background:#fff3df;color:#9a5b00}
ol.passi{margin:0;padding-left:20px;line-height:1.6}
.app header.top,.app footer{display:none}
@media print{header.top,.noprint,footer{display:none!important}.hero{background:#fff;color:var(--ink)}main{margin:0}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand" id="brand">Sogni ed Emozioni · Top Crociere<small>Pagine regalo</small></div><span class="pill" id="pill">🎁 Regalo</span></div></header>
<div id="app"><div class="load"><div class="spin"></div>Caricamento…</div></div>
<footer id="foot">
  <b>Sogni ed Emozioni Viaggi</b> · Via Mazzini 134, Battipaglia (SA)<br>
  sogniedemozioni.it · 0828 304262 &nbsp;|&nbsp; topcrociere.com · 0828 1810125<br>
  info@topcrociere.com · <a href="privacy.html">Privacy</a> · <a href="termini.html">Termini e condizioni</a>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbyU6Gt9vRyP96gRBRWW0Q5qvTLiMh9QbisUCf9G5TaRX-BM7cejqxak-PSduoEpauJXAw/exec';
  var app = document.getElementById('app');
  var qs = new URLSearchParams(location.search);
  var tPub = (qs.get('e') || '').replace(/[^A-Za-z0-9_-]/g, '');
  var tPriv = (qs.get('p') || '').replace(/[^A-Za-z0-9_-]/g, '');
  var tAmico = (qs.get('a') || '').replace(/[^A-Za-z0-9_-]/g, '');
  if (qs.get('app') === '1') document.documentElement.classList.add('app');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function eur(n) { n = Number(n) || 0; return n.toLocaleString('it-IT', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' €'; }
  function dataIt(s) { if (!s) return ''; var d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' }); }
  function $(id) { return document.getElementById(id); }

  /* Chiamata a TopHub (JSONP: funziona senza problemi di CORS) */
  function chiama(par) {
    return new Promise(function (ok, ko) {
      var cb = 'cb' + Date.now().toString(36) + Math.floor(Math.random() * 1e6);
      var s = document.createElement('script');
      var t = setTimeout(function () { pulisci(); ko(new Error('Il collegamento è lento: riprova tra poco.')); }, 25000);
      function pulisci() { clearTimeout(t); delete window[cb]; s.remove(); }
      window[cb] = function (r) { pulisci(); ok(r); };
      var q = new URLSearchParams(par); q.set('regalo', '1'); q.set('callback', cb);
      s.src = API + '?' + q.toString();
      s.onerror = function () { pulisci(); ko(new Error('Connessione non riuscita: controlla internet e riprova.')); };
      document.body.appendChild(s);
    });
  }

  function brand(ev) {
    document.body.className = ev.marchio === 'SE' ? 'se' : 'tc';
    $('brand').innerHTML = esc(ev.nomeMarchio) + '<small>' + esc(ev.prodotto) + '</small>';
    $('pill').textContent = '🎁 ' + (ev.occasione || 'Regalo');
    document.title = (ev.titolo || 'Pagina regalo') + ' · ' + ev.nomeMarchio;
  }

  function hero(ev) {
    return '<section class="hero"><div class="stars"></div><div class="wrap">'
      + (ev.foto ? '<div class="foto" style="background-image:url(\'' + esc(ev.foto) + '\')"' + ((ev.galleria || []).length ? ' data-lb="g" data-i="0" role="button" tabindex="0"' : '') + '></div>' : '<div style="height:24px"></div>')
      + ((ev.galleria || []).length > 1 ? '<div class="strip noprint">' + ev.galleria.slice(1).map(function (u, i) { return '<button type="button" data-lb="g" data-i="' + (i + 1) + '" aria-label="Apri la foto" style="background-image:url(\'' + esc(u) + '\')"></button>'; }).join('') + '</div>' : '')
      + '<div class="occ">' + esc(ev.occasione) + (ev.dataEvento ? ' · ' + dataIt(ev.dataEvento) : '') + '</div>'
      + '<h1>' + esc(ev.titolo) + '</h1>'
      + (ev.festeggiato ? '<div class="chi">Per ' + esc(ev.festeggiato) + '</div>' : '')
      + (ev.messaggio ? '<p class="msg">“' + esc(ev.messaggio) + '”</p>' : '')
      + '</div></section>';
  }

  function cardViaggio(ev) {
    if (!ev.viaggio && ev.percentuale == null && !(ev.fotoDest || []).length) return '';
    return '<div class="card">'
      + (ev.viaggio ? '<div class="viaggio"><div class="ico">✈️</div><div><div class="note">Il viaggio dei sogni</div><h3>' + esc(ev.viaggio) + '</h3>' + (ev.partenza ? '<div class="note">' + esc(ev.partenza) + '</div>' : '') + '</div></div>' : '')
      + ((ev.fotoDest || []).length ? '<div class="destgal">' + ev.fotoDest.map(function (u, i) { return '<button type="button" data-lb="d" data-i="' + i + '" aria-label="Apri la foto della destinazione" style="background-image:url(\'' + esc(u) + '\')"></button>'; }).join('') + '</div>' : '')
      + (ev.percentuale != null ? '<div class="bar"><i style="width:' + ev.percentuale + '%"></i></div><div class="note">' + ev.percentuale + '% del regalo già raccolto</div>' : '')
      + '</div>';
  }

  /* ---------------- Foto: ingrandimento ---------------- */
  var LB_EV = null;
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-lb]'); if (!b || !LB_EV) return;
    var lista = b.getAttribute('data-lb') === 'd' ? (LB_EV.fotoDest || []) : (LB_EV.galleria || []);
    apriLb(lista, Number(b.getAttribute('data-i')) || 0);
  });
  function apriLb(lista, i) {
    if (!lista.length) return;
    var d = document.createElement('div'); d.className = 'lb';
    d.innerHTML = '<img alt="Foto">' + '<button class="x" type="button" aria-label="Chiudi">✕</button>' + (lista.length > 1 ? '<button class="nav p" type="button" aria-label="Precedente">‹</button><button class="nav n" type="button" aria-label="Successiva">›</button>' : '');
    function mostra() { d.querySelector('img').src = lista[i]; }
    function chiudi() { d.remove(); document.removeEventListener('keydown', tasti); }
    function tasti(e) { if (e.key === 'Escape') chiudi(); if (e.key === 'ArrowRight') { i = (i + 1) % lista.length; mostra(); } if (e.key === 'ArrowLeft') { i = (i - 1 + lista.length) % lista.length; mostra(); } }
    d.onclick = function (e) {
      if (e.target.classList.contains('n')) { i = (i + 1) % lista.length; mostra(); }
      else if (e.target.classList.contains('p')) { i = (i - 1 + lista.length) % lista.length; mostra(); }
      else if (e.target.tagName !== 'IMG') chiudi();
    };
    document.addEventListener('keydown', tasti);
    document.body.appendChild(d); mostra();
  }

  /* ---------------- Pagina pubblica ---------------- */
  function paginaPubblica(ev) {
    brand(ev); LB_EV = ev;
    var esp = ev.esperienze || [];
    var h = hero(ev) + '<main><div class="wrap">' + cardViaggio(ev);
    if (!ev.aperto) {
      h += '<div class="card"><h2>La raccolta è chiusa</h2><p class="sub">Grazie di cuore a chi ha partecipato! Per informazioni chiama l’agenzia al ' + esc(ev.contatti.tel) + '.</p></div>';
      app.innerHTML = h + '</div></main>'; return;
    }
    h += '<div class="card" id="cardForm"><h2>Partecipa al regalo</h2><p class="sub">Scegli un’esperienza oppure la cifra che preferisci, e lascia una dedica: la riceverà ' + esc(ev.festeggiato || 'il festeggiato') + '.</p>'
      + '<form class="f" id="form" novalidate>';
    if (esp.length) {
      h += '<div class="esp">' + esp.map(function (x) {
        return '<label><input type="radio" name="esp" value="' + esc(x.id) + '" data-imp="' + Number(x.importo) + '"><div><b>' + esc(x.titolo) + '</b>' + (x.descrizione ? '<small>' + esc(x.descrizione) + '</small>' : '') + '</div><span class="imp">' + eur(x.importo) + '</span></label>';
      }).join('') + '<label><input type="radio" name="esp" value="" checked><div><b>Una cifra a mia scelta</b><small>Va nel regalo comune</small></div></label></div>';
    }
    h += '<div id="boxImporto"><label class="l" for="imp">Importo</label><div class="importi">'
      + [30, 50, 100, 150].map(function (n) { return '<button type="button" data-v="' + n + '">' + n + ' €</button>'; }).join('')
      + '</div><input type="number" id="imp" min="5" max="5000" step="1" inputmode="decimal" placeholder="Altro importo in €"></div>'
      + '<div><label class="l" for="nome">Nome e cognome</label><input type="text" id="nome" autocomplete="name" maxlength="120" required></div>'
      + '<div class="two"><div><label class="l" for="tel">Cellulare</label><input type="tel" id="tel" autocomplete="tel" maxlength="20"></div>'
      + '<div><label class="l" for="email">Email</label><input type="email" id="email" autocomplete="email" maxlength="120"></div></div>'
      + '<div class="note" style="margin-top:-6px">Almeno uno dei due: ti mandiamo la conferma e il tuo codice sconto.</div>'
      + '<div><label class="l" for="ded">Dedica (facoltativa)</label><textarea id="ded" maxlength="600" placeholder="Scrivi il tuo augurio…"></textarea></div>'
      + '<label class="check"><input type="checkbox" id="anon"> Non mostrare il mio nome al festeggiato</label>'
      + '<label class="check"><input type="checkbox" id="nasc"> Non mostrare l’importo al festeggiato</label>'
      + '<div class="trap" aria-hidden="true"><label>Sito <input type="text" id="sito" tabindex="-1" autocomplete="off"></label></div>'
      + '<label class="check"><input type="checkbox" id="cons"> <span>Acconsento al trattamento dei miei dati per gestire la quota e ricevere il codice sconto, e accetto i <a href="termini.html" target="_blank">termini</a>. <a href="#" id="infoPriv">Informativa</a></span></label>'
      + '<div class="note" id="priv" style="display:none">Titolare: ' + esc(ev.intestatario) + ', ' + esc(ev.indirizzo) + '. Usiamo nome, contatti e dedica solo per registrare la tua quota, mandarti la conferma e il codice sconto, e consegnare le dediche al festeggiato. Non vendiamo né cediamo i dati. Puoi chiederne la cancellazione chiamando il ' + esc(ev.contatti.tel) + '. <a href="privacy.html" target="_blank">Informativa completa</a></div>'
      + (ev.carta ? '<div><label class="l">Come vuoi pagare?</label><div class="esp" style="margin:0"><label><input type="radio" name="pag" value="carta" checked><div><b>💳 Carta, Apple Pay o Google Pay</b><small>Pagamento sicuro con viva.com, confermato subito</small><img src="viva-logo.svg" alt="viva.com" style="display:block;height:16px;margin-top:6px"></div></label><label><input type="radio" name="pag" value="bonifico"><div><b>🏦 Bonifico</b><small>Ti diamo IBAN e causale da usare</small></div></label></div></div>' : '')
      + '<div class="err" id="err"></div>'
      + '<button class="btn acc full" id="invia" type="submit">Continua</button>'
      + '</form></div>'
      + '<div class="card"><h3 style="font-size:19px">🎁 Un regalo anche per te</h3><p class="sub" style="margin:6px 0 0">Chi partecipa riceve un codice sconto di <b>' + eur(ev.codiceImporto) + '</b> ' + (ev.marchio === 'SE' ? 'su pacchetti viaggio e soggiorni' : 'sulle Super Crociere') + ' (spesa minima ' + eur(ev.codiceMinimo) + ', valido ' + ev.codiceMesi + ' mesi).</p></div>'
      + '</div></main>';
    app.innerHTML = h;

    var form = $('form'), imp = $('imp'), box = $('boxImporto');
    $('infoPriv').onclick = function (e) { e.preventDefault(); $('priv').style.display = $('priv').style.display === 'none' ? 'block' : 'none'; };
    form.querySelectorAll('.importi button').forEach(function (b) {
